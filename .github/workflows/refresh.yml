name: refresh
on:
  schedule:
    - cron: '0 9 */2 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node collect/build.mjs
        env:
          WOOT_KEY: ${{ secrets.WOOT_KEY }}
          DEBUG_EBAY: ${{ vars.DEBUG_EBAY }}
      - run: |
          git config user.name "Lena Hartmann"
          git config user.email "lena.hartmann@users.noreply.github.com"
          git add docs/deals.json docs/status.json
          git commit -m "Refresh deals" || echo "nothing to commit"
          git push
